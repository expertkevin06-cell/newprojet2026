<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion Projet Kevin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ÉCRAN DE VERROUILLAGE AU DÉMARRAGE -->
  <div id="lockScreen" style="position:fixed; inset:0; background:#0f172a; z-index:9999; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; font-family:sans-serif;">
    <h2 style="margin-bottom:1rem;">Accès protégé</h2>
    <p style="color:#94a3b8; margin-bottom:1rem;">Entrez le mot de passe administrateur</p>
    <input type="password" id="passwordInput" placeholder="Mot de passe" style="padding:0.8rem; border-radius:8px; border:1px solid #475569; background:#1e293b; color:white; width:250px; text-align:center; margin-bottom:1rem;">
    <button onclick="checkPassword()" style="padding:0.8rem 2rem; background:#3b82f6; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Déverrouiller</button>
    <p id="errorMsg" style="color:#ef4444; margin-top:1rem; display:none;">Mot de passe incorrect</p>
  </div>

  <!-- LE RESTE DE VOTRE APPLICATION (masqué au démarrage) -->
  <div id="appContent" style="display:none;">
    <header style="padding:1rem; background:#1e293b; display:flex; justify-content:space-between; align-items:center;">
      <h1 style="margin:0; font-size:1.2rem;">Tableau de bord Kevin</h1>
      <button id="adminBtn" class="hidden" style="padding:0.5rem 1rem; background:#3b82f6; color:white; border:none; border-radius:6px; cursor:pointer;">Mode Admin</button>
    </header>
    
    <main style="padding: 2rem;">
      <h2>Bienvenue</h2>
      <p>Vous êtes connecté en tant qu'administrateur.</p>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
