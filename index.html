<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fusion Kevin</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Arrière-plan animé -->
  <div class="bg-layer">
    <img src="assets/car.png" class="moving-car" alt="">
    <img src="assets/justice.png" class="walking-goddess" alt="">
  </div>

  <!-- En-tête avec bouton administrateur -->
  <header>
    <h1>Tableau de bord Kevin</h1>
    <button id="adminBtn" class="hidden">Mode Admin</button>
  </header>

  <!-- Zone de filtres -->
  <section class="filters">
    <select id="moduleSelect">
      <option value="diagnostic">Auto-Diagnostic</option>
      <option value="bykevin">ByKevin</option>
      <option value="aide">Aide Technique</option>
      <option value="incendie">Étude Incendie</option>
      <option value="legal">Auto-Legal</option>
    </select>

    <label><input type="checkbox" value="urgence" checked> Urgence</label>
    <label><input type="checkbox" value="standard"> Standard</label>
    <label><input type="checkbox" value="archive"> Archive</label>
  </section>

  <!-- Conteneur où les modules fusionnés seront chargés -->
  <main id="moduleContainer">
    <!-- Par défaut, affichage de l'auto-diagnostic -->
    <iframe id="moduleFrame" src="https://expertkevin06-cell.github.io/auto-diagnostic/"></iframe>
  </main>

  <script src="js/app.js"></script>
  <script src="js/third-party.js"></script>
</body>
</html>
