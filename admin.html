<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>Panneau d'administration</h1>
    <a href="index.html" style="color:#3b82f6;text-decoration:none;">← Retour</a>
  </header>

  <main class="admin-main">

    <section class="section card">
      <h2>Mot de passe administrateur</h2>
      <p id="passwordStatus"></p>
      <div class="row">
        <input type="password" id="newPassword" placeholder="Nouveau mot de passe (min. 8 caractères)" autocomplete="new-password">
      </div>
      <div class="row">
        <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" autocomplete="new-password">
      </div>
      <div class="row">
        <button id="savePasswordBtn" class="btn btn-primary">Enregistrer</button>
        <button id="resetPasswordBtn" class="btn btn-danger">Réinitialiser</button>
      </div>
      <p style="color:#64748b;font-size:0.8rem;margin-top:0.5rem;">
        Le mot de passe est haché avec PBKDF2-SHA256 (600 000 itérations) et un sel aléatoire.
        Aucune valeur par défaut n'est définie. Pour une sécurité maximale, utilisez un backend.
      </p>
    </section>

    <section class="section card">
      <h2>Gestion des accès tiers</h2>
      <div class="row">
        <input type="text" id="thirdPartyName" placeholder="Nom du tiers">
        <button id="addAccessBtn" class="btn btn-success">Autoriser</button>
      </div>
      <div id="accessList"></div>
    </section>

  </main>

  <script src="js/crypto-utils.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/third-party.js"></script>
</body>
</html>
